<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta médica</title>
    <link rel="stylesheet" href="../Cadastro/pacienteStyle.css">
</head>
<body>
    <h1>Formulário de Consulta do Paciente</h1>
    <form id="laudoForm">
        <select id="paciente" name="paciente" required>
            <option value="">Selecione o paciente</option>
        </select><br><br>
        
        <label for="symptoms">Sintomas relatados:</label>
        <textarea id="symptoms" name="symptoms" required></textarea><br><br>

        <label for="diagnostic">Diagnóstico dado:</label>
        <textarea id="diagnostic" name="diagnostic" required></textarea><br><br>

        <label for="treatment">Tratamento sugerido:</label>
        <textarea id="treatment" name="treatment" required></textarea><br><br>

        <label for="boolmedicine">Remédio Receitado:</label>
        <select id="boolmedicine" name="boolmedicine" required>
            <option value="1">Sim</option>
            <option value="0">Não</option>
        </select><br><br>

        <label for="medicine">Remédio:</label>
        <textarea id="medicine" name="medicine" required></textarea><br><br>

        <button type="button" id="salvarBtn">Salvar</button>
        <button id="voltaBtn" class="button4" onclick="window.location = '../Laudo/FrontMedico.html'">Voltar</button>
        <button id="blockchainBtn" class="button4">Salvar na Blockchain</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="consulta.js"></script>
</body>
</html>
