<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações do Paciente</title>
    <link rel="stylesheet" href="FrontPaciente.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="FrontPaciente.js"></script>
</head>
<body>
<div class="container">
    <h1>Informações do Paciente</h1>
    
    <div class="patient-info">
        <div class="info-title">Detalhes do Paciente</div>
        <table>
            <tr><th>Nome</th><td data-key="Nome"></td></tr>
            <tr><th>Data de Nascimento</th><td data-key="Data_Nasc"></td></tr>
            <tr><th>Sexo</th><td data-key="Sexo"></td></tr>
            <tr><th>CPF/RG</th><td data-key="CPF"></td></tr>
            <tr><th>Número para Contato</th><td data-key="Telefone"></td></tr>
            <tr><th>CNS</th><td id="paciente-cns" data-key="CNS"></td></tr>
        </table>
    </div>

    <div class="exam-results">
        <div class="info-title">Resultado dos Laudos</div>
        <!-- Conteúdo será carregado dinamicamente -->
    </div>

    <button id="logoutBtn" class="button">Sair</button>
</div>
</body>
</html>
