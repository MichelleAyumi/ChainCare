<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="FrontMedico.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="FrontMedico.js"></script>
</head>
<body>

<div class="container">
    <h1>Informações do Médico</h1>
    
    <div class="doctor-info">
        <h2>Informações do Médico</h2>
        <p>Nome: Dr. John Doe</p>
        <p>Especialidade: Cardiology</p>
        <p>CRM: 123456</p>
    </div>
    <h2>Pesquisa de Paciente</h2>
    <div class="patient-search">
        <input type="text" placeholder="Digite o nome ou CNS do paciente" id="patientSearch">
        <button id="searchPatientBtn" class="button">Buscar</button>
    </div>

    <div class="patient-report" id="patientReport" style="display:none;">
        <h2>Última Consulta</h2>
        <p>Data da Consulta: <span id="consultationDate"></span></p>
        <p>Nome da Clínica: <span id="clinicName"></span></p>
        <p>Convênio: <span id="insurance"></span></p>
        <p>Médico: <span id="reportDoctor"></span></p>
        <p>Sintomas Relatados: <span id="symptoms"></span></p>
        <p>Tratamento sugerido: <span id="treatment"></span></p>
        <p>Prescrição de medicamento: <span id="medication"></span></p>
        <br>
        <br>
    </div>

    <div id="allReports" class="all-reports">
        <!-- Todos os laudos serão exibidos aqui -->
    </div>

    <div class="botoes">
        <button id="consultaBtn" class="button4" onclick="window.location = '../Consulta/consulta.html'">Consulta</button>
        <button id="pacienteBtn" class="button4" onclick="window.location = '../Cadastro/paciente.html'">Paciente</button>
        <button id="blockchainBtn" class="button4">Salvar na Blockchain</button>
        <button id="logoutBtn" class="button4">Sair</button>
    </div>
    
</div>
</body>
</html>
